<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palabra del Día · Fuxia Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: min(100%, 320px); margin: 0 auto 16px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .row.shake { animation: fg-shake .4s; }
  .tile {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 9vw, 2.5rem); color: var(--md-dark);
    border: 2px solid var(--md-line); border-radius: 4px; background: #fff; text-transform: uppercase;
    transition: transform .12s;
  }
  .tile.fill { border-color: var(--md-dark); transform: scale(1.04); }
  .tile.ok, .tile.near, .tile.miss { border-color: transparent; animation: flip .5s both; }
  .tile.ok { background: var(--fg-ok); color: #fff; }
  .tile.near { background: var(--fg-near); color: #1d1d1d; }
  .tile.miss { background: var(--fg-miss); color: #fff; }
  .tile.nofx { animation: none; }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }

  .kb { display: flex; flex-direction: column; gap: 7px; user-select: none; }
  .kb-row { display: flex; gap: 5px; justify-content: center; }
  .key {
    flex: 1; max-width: 42px; height: 52px; border: none; border-radius: 4px; cursor: pointer;
    background: var(--md-line); color: var(--md-dark); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; padding: 0;
  }
  .key.wide { flex: 1.6; max-width: 66px; font-size: .85rem; letter-spacing: .5px; }
  .key.ok { background: var(--fg-ok); color: #fff; }
  .key.near { background: var(--fg-near); color: #1d1d1d; }
  .key.miss { background: #6d6d6a; color: #fff; }
  .kb.off { opacity: .35; pointer-events: none; }
  .pista { margin-top: 10px; font-size: .98rem; color: var(--md-muted); }
  .pista b { color: var(--md-orange); font-family: var(--font-display); text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<header class="fg-masthead">
  <a class="fg-brand" href="https://mansodiario.com" target="_top" rel="noopener"
     aria-label="Ir a la portada de Manso Diario"><span class="logo">MANSO<b>!</b>DIARIO</span><small>Juegos · San Juan · Argentina</small></a>
  <div class="fg-streak" id="racha" title="Racha">🔥 0</div>
</header>
<div class="fg-titlebar"><h1>PALABRA DEL DÍA<b>!</b></h1><a class="fg-back" href="index.html">← Juegos</a></div>
<div class="fg-wrap">
  <div id="app"><p class="fg-sub">Cargando…</p></div>
</div>

<script src="shared.js"></script>
<script>
(function () {
  var JUEGO = 'palabra', INTENTOS = 6, LARGO = 5;
  var FILAS = ['QWERTYUIOP', 'ASDFGHJKL', '*ZXCVBNM#'];   // * = ENTER, # = borrar

  function evaluar(intento, resp) {            // dos pasadas: maneja letras repetidas como Wordle
    var res = new Array(LARGO).fill('miss'), resto = {};
    for (var i = 0; i < LARGO; i++) {
      if (intento[i] === resp[i]) res[i] = 'ok'; else resto[resp[i]] = (resto[resp[i]] || 0) + 1;
    }
    for (i = 0; i < LARGO; i++) {
      if (res[i] !== 'ok' && resto[intento[i]] > 0) { res[i] = 'near'; resto[intento[i]]--; }
    }
    return res;
  }

  FG.iniciar({ json: 'data/palabras.json', clave: 'palabras' }, function (entrada, ctx) {
    var resp = entrada.palabra;
    var estado = FG.estadoDeHoy(JUEGO, ctx.diaN) || { dia: ctx.diaN, intentos: [], terminado: false, gano: false };
    var actual = '';
    var app = document.getElementById('app');
    var elRacha = document.getElementById('racha');
    var prioridad = { miss: 1, near: 2, ok: 3 };

    app.innerHTML = '<p class="fg-sub">Adiviná la palabra de 5 letras en 6 intentos · tema Cuyo / San Juan</p>' +
      '<div class="board" id="board"></div><div id="resultado"></div><div class="kb" id="kb"></div>';
    var board = document.getElementById('board'), kb = document.getElementById('kb');

    for (var r = 0; r < INTENTOS; r++) {
      var fila = document.createElement('div'); fila.className = 'row';
      for (var c = 0; c < LARGO; c++) fila.appendChild(Object.assign(document.createElement('div'), { className: 'tile' }));
      board.appendChild(fila);
    }
    FILAS.forEach(function (f) {
      var d = document.createElement('div'); d.className = 'kb-row';
      f.split('').forEach(function (ch) {
        var b = document.createElement('button');
        b.className = 'key' + (ch === '*' || ch === '#' ? ' wide' : '');
        b.textContent = ch === '*' ? 'ENVIAR' : ch === '#' ? '⌫' : ch;
        b.dataset.k = ch; b.setAttribute('aria-label', ch === '*' ? 'Enviar' : ch === '#' ? 'Borrar' : ch);
        b.addEventListener('click', function () { tecla(ch); });
        d.appendChild(b);
      });
      kb.appendChild(d);
    });

    function actualizarRacha() { elRacha.textContent = '🔥 ' + FG.rachaVigente(JUEGO, ctx.diaN); }
    function pintarFila(i, intento, anim) {
      var res = evaluar(intento, resp), tiles = board.children[i].children;
      for (var j = 0; j < LARGO; j++) {
        tiles[j].textContent = intento[j];
        tiles[j].className = 'tile ' + res[j] + (anim ? '' : ' nofx');
        if (anim) tiles[j].style.animationDelay = (j * 0.12) + 's';
        var key = kb.querySelector('[data-k="' + intento[j] + '"]');
        if (key) {
          var prev = (key.className.match(/\b(ok|near|miss)\b/) || [])[1];
          if (!prev || prioridad[res[j]] > prioridad[prev]) key.className = 'key ' + res[j];
        }
      }
    }
    function pintarActual() {
      var tiles = board.children[estado.intentos.length].children;
      for (var j = 0; j < LARGO; j++) {
        tiles[j].textContent = actual[j] || '';
        tiles[j].className = 'tile' + (actual[j] ? ' fill' : '');
      }
    }
    function tecla(ch) {
      if (estado.terminado) return;
      if (ch === '#') { actual = actual.slice(0, -1); pintarActual(); }
      else if (ch === '*') enviar();
      else if (actual.length < LARGO) { actual += ch; pintarActual(); }
    }
    function enviar() {
      if (actual.length < LARGO) {
        var f = board.children[estado.intentos.length]; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
        FG.toast('Faltan letras'); return;
      }
      var i = estado.intentos.length;
      estado.intentos.push(actual);
      pintarFila(i, actual, true);
      var gano = actual === resp;
      actual = '';
      if (gano || estado.intentos.length === INTENTOS) {
        estado.terminado = true; estado.gano = gano;
        FG.registrarFin(JUEGO, ctx.diaN, gano);
        FG.guardar(JUEGO, 'hoy', estado);
        setTimeout(mostrarResultado, 900);
      } else FG.guardar(JUEGO, 'hoy', estado);
      actualizarRacha();
    }
    function textoCompartir() {
      var grilla = estado.intentos.map(function (it) {
        return evaluar(it, resp).map(function (x) { return x === 'ok' ? '🟩' : x === 'near' ? '🟨' : '⬛'; }).join('');
      }).join('\n');
      return 'FUXIA GAMES · Palabra del Día #' + ctx.diaN + ' ' + (estado.gano ? estado.intentos.length : 'X') + '/' + INTENTOS + '\n' + grilla;
    }
    function mostrarResultado() {
      kb.classList.add('off');
      var el = document.getElementById('resultado');
      el.innerHTML = '<div class="fg-result"><h2 class="gradient-text">' + (estado.gano ? '¡Bien ahí!' : 'Casi…') + '</h2>' +
        '<p>' + (estado.gano ? 'La resolviste en ' + estado.intentos.length + ' de ' + INTENTOS + '.' : 'La palabra de hoy era:') + '</p>' +
        '<p style="font-family:var(--font-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:2.4rem;color:var(--md-dark);margin:2px 0">' + FG.esc(entrada.mostrar) + '</p>' +
        (entrada.pista ? '<p class="pista"><b>¿Sabías que?</b> ' + FG.esc(entrada.pista) + '</p>' : '') +
        '<div class="fg-actions"><button class="btn btn-primary" id="share">Compartir resultado</button></div>' +
        '<p class="fg-next">Próxima palabra en <b id="cuenta"></b></p></div>';
      document.getElementById('share').onclick = function () { FG.compartir(textoCompartir()); };
      FG.cuentaRegresiva(document.getElementById('cuenta'));
    }

    // Estado guardado de hoy: se repinta sin animación
    estado.intentos.forEach(function (it, i) { pintarFila(i, it, false); });
    if (estado.terminado) mostrarResultado(); else pintarActual();
    actualizarRacha();

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Enter') { e.preventDefault(); tecla('*'); }
      else if (e.key === 'Backspace') tecla('#');
      else if (/^[a-zA-Z]$/.test(e.key)) tecla(e.key.toUpperCase());
    });
  });
})();
</script>
</body>
</html>
