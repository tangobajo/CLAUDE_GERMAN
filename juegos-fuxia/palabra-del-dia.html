<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palabra del Día · Fuxia Games</title>
<link rel="icon" href="assets/logo-fuxia-games-icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared.css">
<style>
  .pd-tablero {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    margin: 0 auto;
    width: min(330px, 92vw);
  }
  .pd-fila { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pd-celda {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--fx-borde);
    border-radius: 6px;
    font-family: var(--fx-serif);
    font-size: clamp(1.4rem, 7vw, 2rem);
    font-weight: 700;
    text-transform: uppercase;
    background: transparent;
    user-select: none;
  }
  .pd-celda[data-lleno] { border-color: #5a5261; }
  .pd-celda[data-estado="correcta"] { background: var(--fx-verde);    border-color: var(--fx-verde);    color: #fff; }
  .pd-celda[data-estado="presente"] { background: var(--fx-amarillo);  border-color: var(--fx-amarillo); color: #120E14; }
  .pd-celda[data-estado="ausente"]  { background: var(--fx-borde);     border-color: var(--fx-borde);    color: #fff; }

  .pd-fila--error { animation: pd-sacudir .4s; }
  @keyframes pd-sacudir {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  .pd-teclado { display: flex; flex-direction: column; gap: 6px; }
  .pd-teclado__fila { display: flex; gap: 5px; justify-content: center; }
  .pd-tecla {
    flex: 1 1 auto;
    min-width: 0;
    height: 52px;
    border: 0;
    border-radius: 5px;
    background: var(--fx-superficie-2);
    color: var(--fx-texto);
    font-family: inherit;
    font-size: .92rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    padding: 0 2px;
  }
  .pd-tecla:hover { background: #322a37; }
  .pd-tecla--ancha { flex: 1.6 1 auto; font-size: .74rem; }
  .pd-tecla[data-estado="correcta"] { background: var(--fx-verde);   color: #fff; }
  .pd-tecla[data-estado="presente"] { background: var(--fx-amarillo); color: #120E14; }
  .pd-tecla[data-estado="ausente"]  { background: #241f28; color: #6b6272; }

  .pd-pista {
    text-align: center;
    font-size: .88rem;
    color: var(--fx-texto-suave);
    line-height: 1.5;
    margin: 0;
  }
  .pd-pista strong { color: var(--fx-texto); font-weight: 600; }

  @media (max-height: 700px) { .pd-tecla { height: 44px; } }
</style>
</head>
<body>

<header class="fx-header">
  <a class="fx-header__marca" href="index.html">
    <img class="fx-header__logo fx-header__logo--icono" src="assets/logo-fuxia-games-icono.svg" alt="Fuxia Games">
    <h1 class="fx-header__juego" id="fx-nombre-juego">Palabra del Día</h1>
  </a>
  <a class="fx-volver" href="index.html">← Juegos</a>
</header>

<main class="fx-main" id="pd-app">
  <p class="fx-aviso" id="pd-cargando">Cargando la palabra de hoy…</p>
</main>

<template id="pd-plantilla">
  <p class="pd-pista"><strong>Pista:</strong> <span id="pd-texto-pista"></span></p>
  <div class="pd-tablero" id="pd-tablero" role="group" aria-label="Tablero de intentos"></div>
  <div class="pd-teclado" id="pd-teclado"></div>
</template>

<footer class="fx-footer">
  Fuxia Games para <a href="https://mansodiario.com">Manso Diario</a>.
</footer>

<div class="fx-toast" id="fx-toast" role="status" aria-live="polite"></div>

<script src="shared.js"></script>
<script>
(function () {
  'use strict';

  var FG = window.FuxiaGames;
  var JUEGO = 'palabra';
  var LARGO = 5;
  var INTENTOS = 6;
  var EMOJI = { correcta: '🟩', presente: '🟨', ausente: '⬛' };
  var FILAS_TECLADO = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L','Ñ'],
    ['ENTER','Z','X','C','V','B','N','M','BORRAR']
  ];

  var app = document.getElementById('pd-app');
  var palabra, palabraDisplay, numeroDia;
  var intentos = [];        /* intentos ya confirmados */
  var actual = '';          /* lo que se está tipeando */
  var terminado = false, gano = false;

  FG.pintarCabecera('Palabra del Día');

  FG.cargarDatos('data/palabras.json').then(arrancar).catch(function (e) {
    app.innerHTML = '<p class="fx-aviso fx-aviso--error">No se pudo cargar el juego de hoy. ' +
      'Recargá la página en un rato.<br><small>' + String(e.message || e) + '</small></p>';
  });

  function arrancar(datos) {
    var dia = FG.diaDelBanco(datos);
    numeroDia = dia.numero;
    palabra = FG.normalizar(dia.contenido.palabra);
    palabraDisplay = dia.contenido.palabra_display || dia.contenido.palabra;

    app.innerHTML = '';
    app.appendChild(document.getElementById('pd-plantilla').content.cloneNode(true));
    document.getElementById('pd-texto-pista').textContent = dia.contenido.pista;

    dibujarTablero();
    dibujarTeclado();

    /* Si ya jugó hoy, reponemos la partida tal cual quedó y no lo dejamos
       volver a intentar: solo ve el resultado. */
    var guardado = FG.cargarEstado(JUEGO);
    if (guardado.jugadoHoy && guardado.estado && guardado.estado.intentos) {
      intentos = guardado.estado.intentos.slice(0, INTENTOS);
      terminado = true;
      gano = !!guardado.estado.gano;
      pintarTodo();
      mostrarResultado(true);
    } else {
      document.addEventListener('keydown', alTeclado);
    }
  }

  /* ------------------------------------------------------------ dibujado */

  function dibujarTablero() {
    var tablero = document.getElementById('pd-tablero');
    for (var f = 0; f < INTENTOS; f++) {
      var fila = document.createElement('div');
      fila.className = 'pd-fila';
      fila.id = 'pd-fila-' + f;
      for (var c = 0; c < LARGO; c++) {
        var celda = document.createElement('div');
        celda.className = 'pd-celda';
        celda.id = 'pd-celda-' + f + '-' + c;
        fila.appendChild(celda);
      }
      tablero.appendChild(fila);
    }
  }

  function dibujarTeclado() {
    var teclado = document.getElementById('pd-teclado');
    FILAS_TECLADO.forEach(function (filaTeclas) {
      var fila = document.createElement('div');
      fila.className = 'pd-teclado__fila';
      filaTeclas.forEach(function (t) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'pd-tecla' + (t.length > 1 ? ' pd-tecla--ancha' : '');
        b.textContent = t === 'BORRAR' ? '⌫' : t;
        b.setAttribute('aria-label', t === 'BORRAR' ? 'Borrar' : t);
        b.dataset.tecla = t;
        b.addEventListener('click', function () { procesar(t); });
        fila.appendChild(b);
      });
      teclado.appendChild(fila);
    });
  }

  /* ------------------------------------------------------------ evaluación */

  /**
   * Devuelve un estado por letra al estilo Wordle. Se hace en dos pasadas
   * para que las letras repetidas no se marquen de más: primero se sacan
   * las que están en su lugar, y recién después se reparten las amarillas
   * entre las que sobraron.
   */
  function evaluar(intento) {
    var res = new Array(LARGO);
    var restantes = {};
    var i, ch;

    for (i = 0; i < LARGO; i++) {
      if (intento[i] === palabra[i]) {
        res[i] = 'correcta';
      } else {
        ch = palabra[i];
        restantes[ch] = (restantes[ch] || 0) + 1;
      }
    }
    for (i = 0; i < LARGO; i++) {
      if (res[i]) continue;
      ch = intento[i];
      if (restantes[ch] > 0) { res[i] = 'presente'; restantes[ch]--; }
      else { res[i] = 'ausente'; }
    }
    return res;
  }

  /* ------------------------------------------------------------ interacción */

  function alTeclado(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === 'Enter') { e.preventDefault(); procesar('ENTER'); }
    else if (k === 'Backspace') { e.preventDefault(); procesar('BORRAR'); }
    else if (/^[a-zA-ZñÑáéíóúÁÉÍÓÚ]$/.test(k)) { procesar(FG.normalizar(k)); }
  }

  function procesar(tecla) {
    if (terminado) return;

    if (tecla === 'BORRAR') {
      actual = actual.slice(0, -1);
      pintarFila(intentos.length);
      return;
    }
    if (tecla === 'ENTER') {
      if (actual.length < LARGO) {
        sacudir('Faltan letras');
      } else {
        confirmar();
      }
      return;
    }
    if (actual.length < LARGO) {
      actual += tecla;
      pintarFila(intentos.length);
    }
  }

  function confirmar() {
    var estados = evaluar(actual);
    intentos.push({ texto: actual, estados: estados });
    gano = actual === palabra;
    actual = '';

    pintarTodo();
    terminado = gano || intentos.length >= INTENTOS;

    if (terminado) {
      document.removeEventListener('keydown', alTeclado);
      FG.guardarEstado(JUEGO, { intentos: intentos, gano: gano });
      FG.registrarPartida(JUEGO, gano);
      mostrarResultado(false);
    } else {
      /* Guardamos también la partida a medio hacer: si recarga, no la pierde. */
      FG.guardarEstado(JUEGO, { intentos: intentos, gano: false });
    }
  }

  function sacudir(mensaje) {
    var fila = document.getElementById('pd-fila-' + intentos.length);
    if (!fila) return;
    fila.classList.add('pd-fila--error');
    setTimeout(function () { fila.classList.remove('pd-fila--error'); }, 400);
    FG.toast(mensaje);
  }

  function pintarFila(f) {
    for (var c = 0; c < LARGO; c++) {
      var celda = document.getElementById('pd-celda-' + f + '-' + c);
      if (!celda) continue;
      var letra = actual[c] || '';
      celda.textContent = letra;
      if (letra) celda.setAttribute('data-lleno', '1');
      else celda.removeAttribute('data-lleno');
    }
  }

  function pintarTodo() {
    /* Prioridad de color en el teclado: verde pisa amarillo, amarillo pisa gris. */
    var rango = { correcta: 3, presente: 2, ausente: 1 };
    var mejor = {};

    intentos.forEach(function (it, f) {
      for (var c = 0; c < LARGO; c++) {
        var celda = document.getElementById('pd-celda-' + f + '-' + c);
        celda.textContent = it.texto[c];
        celda.setAttribute('data-lleno', '1');
        celda.setAttribute('data-estado', it.estados[c]);
        var l = it.texto[c];
        if (!mejor[l] || rango[it.estados[c]] > rango[mejor[l]]) mejor[l] = it.estados[c];
      }
    });

    Array.prototype.forEach.call(document.querySelectorAll('.pd-tecla'), function (b) {
      var e = mejor[b.dataset.tecla];
      if (e) b.setAttribute('data-estado', e);
    });

    if (intentos.length < INTENTOS) pintarFila(intentos.length);
  }

  /* ------------------------------------------------------------ resultado */

  function mostrarResultado(esRepaso) {
    var racha = FG.cargarEstado(JUEGO);
    var marcador = gano ? intentos.length + '/' + INTENTOS : 'X/' + INTENTOS;

    var panel = document.createElement('section');
    panel.className = 'fx-resultado';
    panel.innerHTML =
      '<h2>' + (gano ? tituloVictoria(intentos.length) : '¡Casi!') + '</h2>' +
      '<p style="margin:0;color:var(--fx-texto-suave);font-size:.9rem">' +
        (gano ? 'La resolviste en ' + intentos.length + (intentos.length === 1 ? ' intento.' : ' intentos.')
              : 'La palabra era <strong style="color:var(--fx-texto)">' + escapar(palabraDisplay) + '</strong>.') +
      '</p>' +
      '<div class="fx-resultado__stats">' +
        stat(racha.racha, 'Racha') +
        stat(racha.maxRacha, 'Mejor racha') +
        stat(racha.jugados, 'Jugadas') +
      '</div>' +
      '<button class="fx-btn" id="pd-compartir">Compartir resultado</button>' +
      '<a class="fx-btn fx-btn--secundario" href="index.html">Ver los otros juegos</a>' +
      '<p class="fx-proximo">' + (esRepaso ? 'Ya jugaste hoy. ' : '') +
        'Palabra nueva en ' + FG.faltaParaElProximo() + '.</p>';

    document.getElementById('pd-app').appendChild(panel);
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    document.getElementById('pd-compartir').addEventListener('click', function () {
      /* La grilla no revela la palabra: solo los colores de cada intento. */
      var grilla = intentos.map(function (it) {
        return it.estados.map(function (e) { return EMOJI[e]; }).join('');
      });
      FG.compartirResultado(
        FG.armarTextoCompartir('Palabra del Día', numeroDia, marcador, grilla),
        function (m) { FG.toast(m); }
      );
    });
  }

  function tituloVictoria(n) {
    return ['¡Bárbaro!', '¡Genial!', '¡Muy bien!', '¡Bien ahí!', '¡Zafaste!', '¡Uf, por poco!'][n - 1] || '¡Ganaste!';
  }

  function stat(valor, rotulo) {
    return '<span class="fx-stat"><span class="fx-stat__num">' + valor +
           '</span><span class="fx-stat__rotulo">' + rotulo + '</span></span>';
  }

  function escapar(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
})();
</script>

</body>
</html>
