<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia Cuyana · Fuxia Games</title>
<link rel="icon" href="assets/logo-fuxia-games-icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared.css">
<style>
  .tr-progreso { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--md-texto-suave); }
  .tr-puntos { display: flex; gap: 5px; }
  .tr-punto { width: 11px; height: 11px; border-radius: 50%; background: var(--md-borde); display: inline-block; }
  .tr-punto[data-r="bien"] { background: var(--juego-correcta); }
  .tr-punto[data-r="mal"]  { background: var(--juego-error); }

  .tr-pregunta {
    font-family: var(--md-titulo);
    font-size: 1.28rem;
    font-weight: 800;
    letter-spacing: -.3px;
    line-height: 1.25;
    margin: 0;
  }

  .tr-opciones { display: flex; flex-direction: column; gap: 9px; }
  .tr-opcion {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    text-align: left;
    border: 1px solid var(--md-borde);
    border-radius: 8px;
    background: var(--md-superficie);
    color: var(--md-tinta);
    font-family: inherit;
    font-size: .95rem;
    line-height: 1.35;
    padding: 13px 14px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .tr-opcion:hover:not([disabled]) { border-color: var(--md-naranja); background: var(--md-superficie-2); }
  .tr-opcion[disabled] { cursor: default; }
  .tr-opcion__letra {
    flex: 0 0 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--md-borde-fuerte);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .78rem;
    font-weight: 700;
  }
  .tr-opcion[data-r="bien"] { border-color: var(--juego-correcta); background: rgba(106, 170, 100, .14); }
  .tr-opcion[data-r="bien"] .tr-opcion__letra { background: var(--juego-correcta); border-color: var(--juego-correcta); color: #fff; }
  .tr-opcion[data-r="mal"]  { border-color: var(--juego-error); background: rgba(192, 57, 43, .10); }
  .tr-opcion[data-r="mal"] .tr-opcion__letra { background: var(--juego-error); border-color: var(--juego-error); color: #fff; }
  .tr-opcion[data-atenuada] { opacity: .5; }

  .tr-devolucion { display: flex; flex-direction: column; gap: 9px; }
  .tr-veredicto { font-weight: 800; font-size: .95rem; margin: 0; }
  .tr-veredicto[data-r="bien"] { color: #4C8347; }
  .tr-veredicto[data-r="mal"]  { color: var(--juego-error); }
</style>
</head>
<body>

<header class="fx-header">
  <a class="fx-header__marca" href="index.html">
    <img class="fx-header__logo fx-header__logo--icono" src="assets/logo-fuxia-games-icono.svg" alt="Fuxia Games">
    <h1 class="fx-header__juego" id="fx-nombre-juego">Trivia Cuyana</h1>
  </a>
  <a class="fx-volver" href="index.html">← Juegos</a>
</header>

<main class="fx-main" id="tr-app">
  <p class="fx-aviso" id="tr-cargando">Cargando las preguntas de hoy…</p>
</main>

<footer class="fx-footer">
  Fuxia Games para <a href="https://mansodiario.com">Manso Diario</a>.
</footer>

<div class="fx-toast" id="fx-toast" role="status" aria-live="polite"></div>

<script src="shared.js"></script>
<script>
(function () {
  'use strict';

  var FG = window.FuxiaGames;
  var JUEGO = 'trivia';
  var LETRAS = ['A', 'B', 'C', 'D'];
  var EMOJI = { bien: '🟩', mal: '🟥' };

  var app = document.getElementById('tr-app');
  var preguntas, numeroDia;
  var indice = 0;
  var respuestas = [];     /* true / false por pregunta, en orden */

  FG.pintarCabecera('Trivia Cuyana');

  FG.cargarDatos('data/trivia.json').then(arrancar).catch(function (e) {
    app.innerHTML = '<p class="fx-aviso fx-aviso--error">No se pudieron cargar las preguntas de hoy. ' +
      'Recargá la página en un rato.<br><small>' + String(e.message || e) + '</small></p>';
  });

  function arrancar(datos) {
    var dia = FG.diaDelBanco(datos);
    numeroDia = dia.numero;
    /* El campo "verificar" del JSON es para control interno de la redacción:
       no se lee acá ni se muestra nunca en pantalla. */
    preguntas = dia.contenido.preguntas;

    var guardado = FG.cargarEstado(JUEGO);
    if (guardado.jugadoHoy && guardado.estado && guardado.estado.respuestas) {
      respuestas = guardado.estado.respuestas;
      mostrarResultado(true);
    } else {
      pintarPregunta();
    }
  }

  /* ------------------------------------------------------------ pregunta */

  function pintarPregunta() {
    var p = preguntas[indice];
    app.innerHTML = '';

    var cab = document.createElement('div');
    cab.className = 'tr-progreso';
    cab.innerHTML = '<span>Pregunta ' + (indice + 1) + ' de ' + preguntas.length + '</span>' +
                    '<span class="tr-puntos">' + puntos() + '</span>';
    app.appendChild(cab);

    var titulo = document.createElement('p');
    titulo.className = 'tr-pregunta';
    titulo.textContent = p.pregunta;
    app.appendChild(titulo);

    var caja = document.createElement('div');
    caja.className = 'tr-opciones';
    p.opciones.forEach(function (texto, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tr-opcion';
      b.dataset.i = String(i);
      b.innerHTML = '<span class="tr-opcion__letra">' + LETRAS[i] + '</span><span></span>';
      b.lastChild.textContent = texto;
      b.addEventListener('click', function () { responder(i); });
      caja.appendChild(b);
    });
    app.appendChild(caja);
  }

  function puntos() {
    var out = '';
    for (var i = 0; i < preguntas.length; i++) {
      var r = respuestas[i];
      out += '<span class="tr-punto"' + (r === undefined ? '' : ' data-r="' + (r ? 'bien' : 'mal') + '"') + '></span>';
    }
    return out;
  }

  function responder(elegida) {
    var p = preguntas[indice];
    var acerto = elegida === p.respuesta;
    respuestas[indice] = acerto;

    Array.prototype.forEach.call(app.querySelectorAll('.tr-opcion'), function (b) {
      var i = parseInt(b.dataset.i, 10);
      b.disabled = true;
      if (i === p.respuesta) b.setAttribute('data-r', 'bien');
      else if (i === elegida) b.setAttribute('data-r', 'mal');
      else b.setAttribute('data-atenuada', '1');
    });

    /* Repintamos los puntitos de progreso con la respuesta recién dada. */
    app.querySelector('.tr-puntos').innerHTML = puntos();

    var dev = document.createElement('div');
    dev.className = 'tr-devolucion';

    var veredicto = document.createElement('p');
    veredicto.className = 'tr-veredicto';
    veredicto.setAttribute('data-r', acerto ? 'bien' : 'mal');
    veredicto.textContent = acerto ? '¡Correcta!' : 'La correcta era la ' + LETRAS[p.respuesta] + '.';
    dev.appendChild(veredicto);

    /* "Leer la nota" solo si esta pregunta trae link en el JSON. */
    var url = linkSeguro(p.link_nota);
    if (url) {
      var a = document.createElement('a');
      a.className = 'fx-btn fx-btn--secundario';
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';   /* abre fuera del iframe de WordPress */
      a.textContent = 'Leer la nota ↗';
      dev.appendChild(a);
    }

    var seguir = document.createElement('button');
    seguir.type = 'button';
    seguir.className = 'fx-btn';
    seguir.textContent = indice + 1 < preguntas.length ? 'Siguiente pregunta →' : 'Ver mi resultado →';
    seguir.addEventListener('click', avanzar);
    dev.appendChild(seguir);

    app.appendChild(dev);
    dev.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    /* Guardamos pregunta por pregunta: si cierra el navegador a mitad de
       camino, al volver ve el resultado de lo que alcanzó a contestar. */
    FG.guardarEstado(JUEGO, { respuestas: respuestas });
  }

  function avanzar() {
    indice++;
    if (indice < preguntas.length) {
      pintarPregunta();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      FG.guardarEstado(JUEGO, { respuestas: respuestas });
      FG.registrarPartida(JUEGO, aciertos() >= 3);
      mostrarResultado(false);
    }
  }

  /**
   * Solo dejamos pasar http y https. Evita que un link mal cargado en la
   * planilla (un javascript:… pegado por error) termine ejecutándose.
   */
  function linkSeguro(valor) {
    if (!valor) return null;
    var limpio = String(valor).trim();
    return /^https?:\/\//i.test(limpio) ? limpio : null;
  }

  function aciertos() {
    return respuestas.filter(Boolean).length;
  }

  /* ------------------------------------------------------------ resultado */

  function mostrarResultado(esRepaso) {
    var bien = aciertos();
    var total = preguntas.length;
    var est = FG.cargarEstado(JUEGO);

    app.innerHTML = '';
    var panel = document.createElement('section');
    panel.className = 'fx-resultado';
    panel.innerHTML =
      '<h2>' + tituloSegun(bien, total) + '</h2>' +
      '<p class="fx-resultado__grilla">' + grillaEmojis().join('') + '</p>' +
      '<p style="margin:0;font-size:1.05rem"><strong>' + bien + ' de ' + total + '</strong> correctas</p>' +
      '<div class="fx-resultado__stats">' +
        stat(est.racha, 'Racha') + stat(est.maxRacha, 'Mejor racha') + stat(est.jugados, 'Jugadas') +
      '</div>' +
      '<button class="fx-btn" id="tr-compartir">Compartir resultado</button>' +
      '<a class="fx-btn fx-btn--secundario" href="index.html">Ver los otros juegos</a>' +
      '<p class="fx-proximo">' + (esRepaso ? 'Ya jugaste hoy. ' : '') +
        'Preguntas nuevas en ' + FG.faltaParaElProximo() + '.</p>';
    app.appendChild(panel);

    document.getElementById('tr-compartir').addEventListener('click', function () {
      /* Solo el patrón de aciertos: no se comparte ni la pregunta ni la
         respuesta, así el que lo recibe puede jugarlo igual. */
      FG.compartirResultado(
        FG.armarTextoCompartir('Trivia Cuyana', numeroDia, bien + '/' + total, [grillaEmojis().join('')]),
        function (m) { FG.toast(m); }
      );
    });
  }

  function grillaEmojis() {
    var out = [];
    for (var i = 0; i < preguntas.length; i++) {
      out.push(respuestas[i] === undefined ? '⬜' : EMOJI[respuestas[i] ? 'bien' : 'mal']);
    }
    return out;
  }

  function tituloSegun(bien, total) {
    if (bien === total) return '¡Cuyano de ley!';
    if (bien >= total - 1) return '¡Muy bien!';
    if (bien >= Math.ceil(total / 2)) return '¡Bien ahí!';
    if (bien > 0) return 'Para la próxima';
    return 'Mañana es otro día';
  }

  function stat(valor, rotulo) {
    return '<span class="fx-stat"><span class="fx-stat__num">' + valor +
           '</span><span class="fx-stat__rotulo">' + rotulo + '</span></span>';
  }
})();
</script>

</body>
</html>
