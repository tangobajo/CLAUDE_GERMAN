<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agrupá · Fuxia Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .solved { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .grupo { border-radius: 4px; padding: 10px 8px; text-align: center; color: #1d1d1d; animation: fg-pop .25s ease-out; }
  .grupo b { display: block; font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 1.1rem; text-transform: uppercase; letter-spacing: .4px; }
  .grupo span { font-size: .88rem; font-weight: 600; }
  .lvl-amarillo { background: var(--lvl-amarillo); }
  .lvl-verde { background: var(--lvl-verde); }
  .lvl-azul { background: var(--lvl-azul); }
  .lvl-morado { background: var(--lvl-morado); }
  .grupo.revelado { opacity: .85; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .item {
    min-height: 62px; border: 2px solid var(--md-line); border-radius: 4px; cursor: pointer;
    background: #fff; color: var(--md-dark); font-family: var(--font-base); font-weight: 700; text-transform: uppercase;
    font-size: clamp(.6rem, 2.9vw, .82rem); padding: 4px; overflow-wrap: anywhere; line-height: 1.1;
    transition: transform .1s, background .1s;
  }
  .item:hover { border-color: var(--md-dark); }
  .item:active { transform: translateY(1px); }
  .item.sel { background: var(--md-dark); color: #fff; border-color: var(--md-orange); }
  .grid.shake { animation: fg-shake .4s; }
  .grid.off .item { pointer-events: none; }

  .vidas { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 4px; color: var(--md-muted); font-family: var(--font-display); text-transform: uppercase; letter-spacing: .8px; font-size: .95rem; font-weight: 600; }
  .vida { width: 12px; height: 12px; border-radius: 50%; background: var(--md-orange); transition: transform .2s, background .2s; }
  .vida.off { background: #c4c4c1; transform: scale(.7); }
</style>
</head>
<body>
<header class="fg-masthead">
  <a class="fg-brand" href="https://mansodiario.com" target="_top" rel="noopener"
     aria-label="Ir a la portada de Manso Diario"><span class="logo">MANSO<b>!</b>DIARIO</span><small>Juegos · San Juan · Argentina</small></a>
  <div class="fg-streak" id="racha" title="Racha">🔥 0</div>
</header>
<div class="fg-titlebar"><h1>AGRUPÁ<b>!</b></h1><a class="fg-back" href="index.html">← Juegos</a></div>
<div class="fg-wrap">
  <div id="app"><p class="fg-sub">Cargando…</p></div>
</div>

<script src="shared.js"></script>
<script>
(function () {
  var JUEGO = 'agrupa', MAX_ERRORES = 4;
  var EMOJI = { amarillo: '🟨', verde: '🟩', azul: '🟦', morado: '🟪' };
  var ORDEN_NIVEL = ['amarillo', 'verde', 'azul', 'morado'];

  function semilla(n) {                       // mezcla reproducible (mulberry32)
    return function () { n |= 0; n = n + 0x6D2B79F5 | 0; var t = Math.imul(n ^ n >>> 15, 1 | n);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function mezclar(arr, rnd) {
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }
  function clave(palabras) { return palabras.slice().sort().join('|'); }
  function comunes(a, b) {                     // cuántas palabras comparten (como multiconjunto)
    var m = {}, n = 0; b.forEach(function (w) { m[w] = (m[w] || 0) + 1; });
    a.forEach(function (w) { if (m[w] > 0) { m[w]--; n++; } });
    return n;
  }

  FG.iniciar({ json: 'data/categorias.json', clave: 'dias' }, function (entrada, ctx) {
    var grupos = entrada.grupos;                 // 4 grupos: {dificultad, categoria, items[4]}
    var tiles = [];                              // 16 fichas; el id es su posición (permite palabras repetidas)
    grupos.forEach(function (g) { g.items.forEach(function (w) { tiles.push(w); }); });

    var estado = FG.estadoDeHoy(JUEGO, ctx.diaN);
    if (!estado) {
      var ids = tiles.map(function (_, i) { return i; });
      estado = { dia: ctx.diaN, orden: mezclar(ids, semilla(ctx.diaN * 7919 + 13)), resueltos: [], errores: 0,
                 intentos: [], filas: [], terminado: false, gano: false };
      FG.guardar(JUEGO, 'hoy', estado);
    }
    var sel = [];
    var app = document.getElementById('app'), elRacha = document.getElementById('racha');
    app.innerHTML = '<p class="fg-sub">Encontrá 4 grupos de 4 palabras con algo en común.</p>' +
      '<div class="solved" id="solved"></div><div class="grid" id="grid"></div>' +
      '<div class="vidas" id="vidas"></div>' +
      '<div class="fg-actions" id="acciones"><button class="btn btn-ghost" id="bMezclar">Mezclar</button>' +
      '<button class="btn btn-ghost" id="bQuitar">Deseleccionar</button><button class="btn btn-primary" id="bEnviar" disabled>Enviar</button></div>' +
      '<div id="resultado"></div>';
    var elSolved = document.getElementById('solved'), elGrid = document.getElementById('grid');
    var bEnviar = document.getElementById('bEnviar');

    function actualizarRacha() { elRacha.textContent = '🔥 ' + FG.rachaVigente(JUEGO, ctx.diaN); }
    function guardar() { FG.guardar(JUEGO, 'hoy', estado); }
    function grupoHTML(gi, revelado) {
      var g = grupos[gi];
      return '<div class="grupo lvl-' + g.dificultad + (revelado ? ' revelado' : '') + '"><b>' + FG.esc(g.categoria) + '</b><span>' +
        g.items.map(FG.esc).join(', ') + '</span></div>';
    }
    function pintar() {
      elSolved.innerHTML = estado.resueltos.map(function (gi) { return grupoHTML(gi, false); }).join('');
      if (estado.terminado && !estado.gano) {      // derrota: se muestran los grupos que faltaban
        var faltan = [0, 1, 2, 3].filter(function (g) { return estado.resueltos.indexOf(g) < 0; });
        faltan.sort(function (a, b) { return ORDEN_NIVEL.indexOf(grupos[a].dificultad) - ORDEN_NIVEL.indexOf(grupos[b].dificultad); });
        elSolved.innerHTML += faltan.map(function (g) { return grupoHTML(g, true); }).join('');
      }
      elGrid.innerHTML = '';
      restantes().forEach(function (id) {
        var b = document.createElement('button');
        b.className = 'item' + (sel.indexOf(id) >= 0 ? ' sel' : '');
        b.textContent = tiles[id]; b.dataset.id = id;
        b.addEventListener('click', function () { alternar(id); });
        elGrid.appendChild(b);
      });
      elGrid.style.display = (estado.terminado || restantes().length === 0) ? 'none' : '';
      var v = '';
      for (var i = 0; i < MAX_ERRORES; i++) v += '<span class="vida' + (i < MAX_ERRORES - estado.errores ? '' : ' off') + '"></span>';
      document.getElementById('vidas').innerHTML = 'Intentos restantes ' + v;
      bEnviar.disabled = sel.length !== 4 || estado.terminado;
      document.getElementById('acciones').style.display = estado.terminado ? 'none' : '';
    }
    function restantes() {                       // fichas que siguen en el tablero, en el orden mezclado
      var quitadas = {};
      estado.resueltos.forEach(function (gi) { (estado.fichasResueltas || {})[gi] && estado.fichasResueltas[gi].forEach(function (id) { quitadas[id] = 1; }); });
      return estado.orden.filter(function (id) { return !quitadas[id]; });
    }
    function alternar(id) {
      if (estado.terminado) return;
      var i = sel.indexOf(id);
      if (i >= 0) sel.splice(i, 1); else if (sel.length < 4) sel.push(id);
      pintar();
    }
    function enviar() {
      if (sel.length !== 4 || estado.terminado) return;
      var palabras = sel.map(function (id) { return tiles[id]; }), k = clave(palabras);
      if (estado.intentos.indexOf(k) >= 0) { FG.toast('Esa combinación ya la probaste'); return; }
      var libres = [0, 1, 2, 3].filter(function (g) { return estado.resueltos.indexOf(g) < 0; });
      var acierto = null, cerca = false;
      libres.forEach(function (g) {
        var n = comunes(palabras, grupos[g].items);
        if (n === 4) acierto = g; else if (n === 3) cerca = true;
      });
      estado.intentos.push(k);
      if (acierto !== null) {
        estado.filas.push(EMOJI[grupos[acierto].dificultad].repeat(4));
        estado.fichasResueltas = estado.fichasResueltas || {};
        estado.fichasResueltas[acierto] = sel.slice();
        estado.resueltos.push(acierto);
        sel = [];
        if (estado.resueltos.length === 4) fin(true);
      } else {
        // fila de emojis: color del grupo al que pertenece cada palabra elegida (no revela cuál es la respuesta)
        estado.filas.push(palabras.map(function (w) {
          for (var g = 0; g < 4; g++) if (grupos[g].items.indexOf(w) >= 0) return EMOJI[grupos[g].dificultad];
          return '⬛';
        }).join(''));
        estado.errores++;
        elGrid.classList.remove('shake'); void elGrid.offsetWidth; elGrid.classList.add('shake');
        FG.toast(cerca ? '¡Te falta una!' : 'Ese grupo no es');
        if (estado.errores >= MAX_ERRORES) fin(false);
      }
      guardar(); pintar();
    }
    function fin(gano) {
      estado.terminado = true; estado.gano = gano; sel = [];
      FG.registrarFin(JUEGO, ctx.diaN, gano); guardar(); actualizarRacha();
      setTimeout(mostrarResultado, 250);
    }
    function textoCompartir() {
      return 'FUXIA GAMES · Agrupá #' + ctx.diaN + ' ' + (estado.gano ? (estado.errores === 0 ? '¡perfecto!' : estado.errores + ' error' + (estado.errores > 1 ? 'es' : '')) : 'X') +
        '\n' + estado.filas.join('\n');
    }
    function mostrarResultado() {
      var el = document.getElementById('resultado');
      el.innerHTML = '<div class="fg-result"><h2 class="gradient-text">' + (estado.gano ? (estado.errores === 0 ? '¡Perfecto!' : '¡Lo lograste!') : 'Se acabaron los intentos') + '</h2>' +
        '<p>' + (estado.gano ? 'Errores: ' + estado.errores + ' de ' + MAX_ERRORES + '.' : 'Estos eran los grupos que faltaban.') + '</p>' +
        '<div class="fg-grid-share">' + FG.esc(estado.filas.join('\n')) + '</div>' +
        '<div id="compartir"></div>' +
        '<p class="fg-next">Nuevo desafío en <b id="cuenta"></b></p></div>';
      FG.pintarCompartir(document.getElementById('compartir'), textoCompartir(), JUEGO);
      FG.cuentaRegresiva(document.getElementById('cuenta'));
      pintar();
    }

    document.getElementById('bMezclar').onclick = function () {
      mezclar(estado.orden, Math.random); guardar(); pintar();
    };
    document.getElementById('bQuitar').onclick = function () { sel = []; pintar(); };
    bEnviar.onclick = enviar;

    pintar(); actualizarRacha();
    if (estado.terminado) mostrarResultado();
  });
})();
</script>
</body>
</html>
